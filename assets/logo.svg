<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="windex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Arka Plan Kutusu -->
  <rect width="120" height="120" rx="28" fill="#0C0E12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  
  <!-- Geometrik W Amblemi -->
  <g filter="url(#glow)">
    <!-- Sol Kanat -->
    <path d="M 28 35 L 42 85 L 54 58 L 44 35 Z" fill="url(#windex-grad)" opacity="0.9"/>
    <!-- Sağ Kanat -->
    <path d="M 92 35 L 78 85 L 66 58 L 76 35 Z" fill="url(#windex-grad)" opacity="0.9"/>
    <!-- Orta Elmas / Baklava Parçası -->
    <polygon points="60,32 70,52 60,72 50,52" fill="#00F2FE"/>
  </g>
</svg>
